[package]
name = "hftengine-runner"
version = "0.1.0"
edition = "2024"
description = "Runs a market-making strategy in hftbacktest and records every frame for the hftengine dashboard"

[dependencies]
hftbacktest = { path = "../hftbacktest/hftbacktest", default-features = false, features = ["backtest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
